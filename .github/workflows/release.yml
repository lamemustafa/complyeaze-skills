name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: complyeaze-skills-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version and release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Never cut a release from an unverified tree. Same gates as CI.
      - name: Skill structure
        run: python3 .github/scripts/validate_skills.py

      - name: Tax engine golden tests and invariants
        run: python3 skills/itr-filing-copilot/scripts/compute_tax.py --self-test

      - name: Golden case file
        run: |
          python3 skills/itr-filing-copilot/scripts/compute_tax.py \
            --golden skills/itr-filing-copilot/evals/golden/cases.json

      - name: Parsers against synthetic fixtures
        run: python3 .github/scripts/test_parsers.py

      - name: No real tax data
        run: python3 .github/scripts/scan_pii.py

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # v0.x is alpha. Mark every generated release as a prerelease so nobody
      # mistakes it for a stable one.
      - name: Mark the release as a prerelease
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ steps.release.outputs.tag_name }}" --prerelease
